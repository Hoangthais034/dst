version: '3.8'

services:
  dst-server:
    image: webhippie/dst:latest
    container_name: dst-server
    restart: unless-stopped
    ports:
      - "10999:10999/udp"    # Game server port
      - "27017:27017/udp"    # Steam master server port
      - "8767:8767/udp"      # Steam authentication port
    volumes:
      - ./data:/var/lib/game
      - ./logs:/var/log/steam
    environment:
      # Cluster Token - BẮT BUỘC phải có để server hoạt động
      # Lấy từ: https://accounts.klei.com/account/game/servers?game=DontStarveTogether
      - DST_CLUSTER_TOKEN=${DST_CLUSTER_TOKEN}
      
      # Cấu hình cơ bản
      - DST_NETWORK_CLUSTER_NAME=${DST_NETWORK_CLUSTER_NAME:-Dont Starve Together}
      - DST_NETWORK_CLUSTER_DESCRIPTION=${DST_NETWORK_CLUSTER_DESCRIPTION:-My DST Server}
      - DST_NETWORK_CLUSTER_PASSWORD=${DST_NETWORK_CLUSTER_PASSWORD:-}
      - DST_NETWORK_CLUSTER_LANGUAGE=${DST_NETWORK_CLUSTER_LANGUAGE:-en}
      - DST_NETWORK_CLUSTER_INTENTION=${DST_NETWORK_CLUSTER_INTENTION:-cooperative}
      
      # Gameplay settings
      - DST_GAMEPLAY_GAME_MODE=${DST_GAMEPLAY_GAME_MODE:-endless}
      - DST_GAMEPLAY_MAX_PLAYERS=${DST_GAMEPLAY_MAX_PLAYERS:-6}
      - DST_GAMEPLAY_PVP=${DST_GAMEPLAY_PVP:-false}
      - DST_GAMEPLAY_PAUSE_WHEN_EMPTY=${DST_GAMEPLAY_PAUSE_WHEN_EMPTY:-true}
      - DST_GAMEPLAY_VOTE_ENABLED=${DST_GAMEPLAY_VOTE_ENABLED:-true}
      
      # Network settings
      - DST_NETWORK_SERVER_PORT=10999
      - DST_NETWORK_TICK_RATE=${DST_NETWORK_TICK_RATE:-15}
      - DST_NETWORK_LAN_ONLY_SERVER=${DST_NETWORK_LAN_ONLY_SERVER:-false}
      - DST_NETWORK_OFFLINE_CLUSTER=${DST_NETWORK_OFFLINE_CLUSTER:-false}
      - DST_NETWORK_AUTOSAVER_ENABLED=${DST_NETWORK_AUTOSAVER_ENABLED:-true}
      - DST_NETWORK_WHITELIST_SLOTS=${DST_NETWORK_WHITELIST_SLOTS:-0}
      
      # Steam settings
      - DST_STEAM_AUTHENTICATION_PORT=8767
      - DST_STEAM_MASTER_SERVER_PORT=27017
      - DST_STEAM_GROUP_ID=${DST_STEAM_GROUP_ID:-0}
      - DST_STEAM_GROUP_ONLY=${DST_STEAM_GROUP_ONLY:-false}
      - DST_STEAM_GROUP_ADMINS=${DST_STEAM_GROUP_ADMINS:-false}
      
      # Server region
      - DST_SERVER_REGION=${DST_SERVER_REGION:-EU}
      
      # Console
      - DST_MISC_CONSOLE_ENABLED=${DST_MISC_CONSOLE_ENABLED:-true}
      
      # Shard settings (để chạy server đơn giản, không cần shard)
      - DST_SHARD_ENABLED=false
      - DST_SHARD_IS_MASTER=true
      - DST_SHARD_NAME=Master
      
      # Mod settings
      - DST_ENABLE_MOD_ERROR=${DST_ENABLE_MOD_ERROR:-false}
      - DST_ENABLE_MOD_DEBUG_PRINT=${DST_ENABLE_MOD_DEBUG_PRINT:-false}
    networks:
      - dst-network

networks:
  dst-network:
    driver: bridge

