version: '3.8'

services:
  dst-server:
    image: webhippie/dst:latest
    container_name: dst-server
    restart: unless-stopped
    ports:
      - "${DST_NETWORK_SERVER_PORT}:${DST_NETWORK_SERVER_PORT}/udp"    # Game server port
      - "${DST_STEAM_MASTER_SERVER_PORT}:${DST_STEAM_MASTER_SERVER_PORT}/udp"    # Steam master server port
      - "${DST_STEAM_AUTHENTICATION_PORT}:${DST_STEAM_AUTHENTICATION_PORT}/udp"      # Steam authentication port
    volumes:
      - ${DST_HOST_DATA_DIR}:/var/lib/game
      - ./logs:/var/log/steam
    environment:
      # Cluster Token - BẮT BUỘC phải có để server hoạt động
      # Lấy từ: https://accounts.klei.com/account/game/servers?game=DontStarveTogether
      - DST_CLUSTER_TOKEN=${DST_CLUSTER_TOKEN}
      
      # Cấu hình cơ bản
      - DST_NETWORK_CLUSTER_NAME=${DST_NETWORK_CLUSTER_NAME}
      - DST_NETWORK_CLUSTER_DESCRIPTION=${DST_NETWORK_CLUSTER_DESCRIPTION}
      - DST_NETWORK_CLUSTER_PASSWORD=${DST_NETWORK_CLUSTER_PASSWORD}
      - DST_NETWORK_CLUSTER_LANGUAGE=${DST_NETWORK_CLUSTER_LANGUAGE}
      - DST_NETWORK_CLUSTER_INTENTION=${DST_NETWORK_CLUSTER_INTENTION}
      
      # Gameplay settings
      - DST_GAMEPLAY_GAME_MODE=${DST_GAMEPLAY_GAME_MODE}
      - DST_GAMEPLAY_MAX_PLAYERS=${DST_GAMEPLAY_MAX_PLAYERS}
      - DST_GAMEPLAY_PVP=${DST_GAMEPLAY_PVP}
      - DST_GAMEPLAY_PAUSE_WHEN_EMPTY=${DST_GAMEPLAY_PAUSE_WHEN_EMPTY}
      - DST_GAMEPLAY_VOTE_ENABLED=${DST_GAMEPLAY_VOTE_ENABLED}
      
      # Network settings
      - DST_NETWORK_SERVER_PORT=${DST_NETWORK_SERVER_PORT}
      - DST_NETWORK_TICK_RATE=${DST_NETWORK_TICK_RATE}
      - DST_NETWORK_LAN_ONLY_SERVER=${DST_NETWORK_LAN_ONLY_SERVER}
      - DST_NETWORK_OFFLINE_CLUSTER=${DST_NETWORK_OFFLINE_CLUSTER}
      - DST_NETWORK_AUTOSAVER_ENABLED=${DST_NETWORK_AUTOSAVER_ENABLED}
      - DST_NETWORK_WHITELIST_SLOTS=${DST_NETWORK_WHITELIST_SLOTS}
      
      # Steam settings
      - DST_STEAM_AUTHENTICATION_PORT=${DST_STEAM_AUTHENTICATION_PORT}
      - DST_STEAM_MASTER_SERVER_PORT=${DST_STEAM_MASTER_SERVER_PORT}
      - DST_STEAM_GROUP_ID=${DST_STEAM_GROUP_ID}
      - DST_STEAM_GROUP_ONLY=${DST_STEAM_GROUP_ONLY}
      - DST_STEAM_GROUP_ADMINS=${DST_STEAM_GROUP_ADMINS}
      
      # Console
      - DST_MISC_CONSOLE_ENABLED=${DST_MISC_CONSOLE_ENABLED}
      
      # Shard settings (để chạy server đơn giản, không cần shard)
      - DST_SHARD_ENABLED=${DST_SHARD_ENABLED}
      - DST_SHARD_IS_MASTER=${DST_SHARD_IS_MASTER}
      - DST_SHARD_NAME=${DST_SHARD_NAME}
      - DST_SHARD_BIND_IP=${DST_SHARD_BIND_IP}
      - DST_SHARD_CLUSTER_KEY=${DST_SHARD_CLUSTER_KEY}
      - DST_SHARD_ID=${DST_SHARD_ID}
      - DST_SHARD_MASTER_IP=${DST_SHARD_MASTER_IP}
      - DST_SHARD_MASTER_PORT=${DST_SHARD_MASTER_PORT}
      
      # Server và cluster settings
      - DST_SERVER_CLUSTER=${DST_SERVER_CLUSTER}
      - DST_SERVER_CONF_DIR=${DST_SERVER_CONF_DIR}
      - DST_SERVER_PERSISTENT_STORAGE_ROOT=${DST_SERVER_PERSISTENT_STORAGE_ROOT}
      - DST_SERVER_REGION=${DST_SERVER_REGION}
      
      # Account settings
      - DST_ACCOUNT_ENCODE_USER_PATH=${DST_ACCOUNT_ENCODE_USER_PATH}
      
      # Mod settings
      - DST_ENABLE_MOD_ERROR=${DST_ENABLE_MOD_ERROR}
      - DST_ENABLE_MOD_DEBUG_PRINT=${DST_ENABLE_MOD_DEBUG_PRINT}
      - DST_FORCE_ENABLE_MODS=${DST_FORCE_ENABLE_MODS}
      - DST_MOD_OVERRIDES_RAW=${DST_MOD_OVERRIDES_RAW}
      - DST_SERVER_MOD_COLLECTION_SETUP=${DST_SERVER_MOD_COLLECTION_SETUP}
      - DST_SERVER_MOD_SETUP=${DST_SERVER_MOD_SETUP}
      
      # Skip settings (bỏ qua các bước cấu hình)
      - DST_SKIP_CLUSTER_CONFIG=${DST_SKIP_CLUSTER_CONFIG}
      - DST_SKIP_GAME_CHOWN=${DST_SKIP_GAME_CHOWN}
      - DST_SKIP_GAME_UPGRADE=${DST_SKIP_GAME_UPGRADE}
      - DST_SKIP_LEVELDATA_OVERRIDE=${DST_SKIP_LEVELDATA_OVERRIDE}
      - DST_SKIP_MOD_OVERRIDES=${DST_SKIP_MOD_OVERRIDES}
      - DST_SKIP_MOD_SETTINGS=${DST_SKIP_MOD_SETTINGS}
      - DST_SKIP_MOD_SETUP=${DST_SKIP_MOD_SETUP}
      - DST_SKIP_SERVER_CONFIG=${DST_SKIP_SERVER_CONFIG}
      - DST_SKIP_STATE_CHOWN=${DST_SKIP_STATE_CHOWN}
      
      # World override settings (các tùy chọn quan trọng)
      - DST_OVERRIDE_PRESET=${DST_OVERRIDE_PRESET}
      - DST_OVERRIDE_WORLD_SIZE=${DST_OVERRIDE_WORLD_SIZE}
      - DST_OVERRIDE_SEASON_START=${DST_OVERRIDE_SEASON_START}
      - DST_OVERRIDE_HIDEMINIMAP=${DST_OVERRIDE_HIDEMINIMAP}
      - DST_OVERRIDE_HAS_OCEAN=${DST_OVERRIDE_HAS_OCEAN}
      - DST_OVERRIDE_LEVEL_STRING=${DST_OVERRIDE_LEVEL_STRING}
    networks:
      - dst-network

networks:
  dst-network:
    driver: bridge

