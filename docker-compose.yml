version: '3.8'

services:
  dst-server:
    image: jamesits/dst-server:latest
    container_name: dst-server
    restart: unless-stopped
    ports:
      - "${DST_PORT_START}-${DST_PORT_END}:10999-11000/udp"
      - "${DST_MASTER_PORT_START}-${DST_MASTER_PORT_END}:12346-12347/udp"
    volumes:
      - ./data:/data
      - ./logs:/logs
    environment:
      - DST_SERVER_ARCH=${DST_SERVER_ARCH}
      - DST_SERVER_TOKEN=${DST_SERVER_TOKEN}
      - DST_SERVER_CLUSTER=${DST_SERVER_CLUSTER}
      - DST_SERVER_CLUSTER_PASSWORD=${DST_SERVER_CLUSTER_PASSWORD}
      - DST_SERVER_CLUSTER_DESCRIPTION=${DST_SERVER_CLUSTER_DESCRIPTION}
      - DST_SERVER_CLUSTER_INTENTION=${DST_SERVER_CLUSTER_INTENTION}
      - DST_SERVER_CLUSTER_LANGUAGE=${DST_SERVER_CLUSTER_LANGUAGE}
      - DST_SERVER_CLUSTER_PVP=${DST_SERVER_CLUSTER_PVP}
      - DST_SERVER_CLUSTER_PAUSE_WHEN_EMPTY=${DST_SERVER_CLUSTER_PAUSE_WHEN_EMPTY}
      - DST_SERVER_CLUSTER_AUTOSAVE=${DST_SERVER_CLUSTER_AUTOSAVE}
      - DST_SERVER_CLUSTER_TICK_RATE=${DST_SERVER_CLUSTER_TICK_RATE}
      - DST_SERVER_CLUSTER_MAX_PLAYERS=${DST_SERVER_CLUSTER_MAX_PLAYERS}
      - DST_SERVER_CLUSTER_GAME_MODE=${DST_SERVER_CLUSTER_GAME_MODE}
      - DST_SERVER_CLUSTER_STEAM_GROUP_ID=${DST_SERVER_CLUSTER_STEAM_GROUP_ID}
      - DST_SERVER_CLUSTER_STEAM_GROUP_ONLY=${DST_SERVER_CLUSTER_STEAM_GROUP_ONLY}
      - DST_SERVER_CLUSTER_STEAM_GROUP_ADMINS=${DST_SERVER_CLUSTER_STEAM_GROUP_ADMINS}
      - DST_SERVER_CLUSTER_ENCODE_USER_PATH=${DST_SERVER_CLUSTER_ENCODE_USER_PATH}
      - DST_SERVER_CLUSTER_ID=${DST_SERVER_CLUSTER_ID}
    networks:
      - dst-network
    healthcheck:
      test: ["CMD", "test", "-f", "/data/.klei/DoNotStarveTogether/Cluster_1/Master/server_log.txt"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  dst-network:
    driver: bridge

